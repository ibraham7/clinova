# Pin the build so every deploy prerenders pages, sitemap.xml, robots.txt and llms.txt.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Serena's copy of the site's own texts: public content, but not a page for search engines.
[[headers]]
  for = "/serena/*"
  [headers.values]
    X-Robots-Tag = "noindex"
